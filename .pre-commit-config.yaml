default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/GDQuest/GDScript-formatter
    rev: 0.24.0
    hooks:
      - id: gdscript-formatter
        entry: gdscript-formatter --reorder-code --max-line-length=120
  # GDScript Toolkit
  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: 4.5.0
    hooks:
      - id: gdlint
        name: gdlint
        description: "gdlint - linter for GDScript"
        entry: gdlint
        language: python
        language_version: python3
        require_serial: true
        types: [gdscript]
